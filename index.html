<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>キキクル × 現在地表示アプリ</title>
  
  <!-- Leaflet.js (地図ライブラリ) の読み込み -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #map {
      height: 100vh;
      width: 100vw;
    }

    /* レイヤー切り替えUI */
    .control-panel {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      padding: 10px 14px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      font-size: 14px;
    }
    .control-panel label {
      display: block;
      margin-bottom: 6px;
      cursor: pointer;
    }
    .control-panel select {
      width: 100%;
      padding: 4px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }

    /* 現在地移動ボタン */
    .location-btn {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 1000;
      background: #ffffff;
      border: none;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .location-btn:active {
      background-color: #f0f0f0;
    }
    .location-btn svg {
      fill: #007bff;
      width: 28px;
      height: 28px;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- キキクルの種類切り替えパネル -->
  <div class="control-panel">
    <strong>キキクル表示切り替え</strong>
    <select id="kikikuru-type" onchange="changeKikikuruLayer(this.value)">
      <option value="target_snow">大雨・土砂災害（大雨キキクル）</option>
      <option value="land">土砂災害（土砂キキクル）</option>
      <option value="inund">浸水害（浸水キキクル）</option>
      <option value="flood">洪水害（洪水キキクル）</option>
    </select>
  </div>
  
  <!-- 現在地ボタン -->
  <button class="location-btn" onclick="moveToCurrentLocation()" title="現在地に移動">
    <svg viewBox="0 0 24 24">
      <path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3c-.46-4.17-3.77-7.48-7.94-7.94V1h-2v2.06C6.83 3.52 3.52 6.83 3.06 11H1v2h2.06c.46 4.17 3.77 7.48 7.94 7.94V23h2v-2.06c4.17-.46 7.48-3.77 7.94-7.94H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.
